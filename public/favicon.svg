<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Dark Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1329" />
      <stop offset="100%" stop-color="#060913" />
    </linearGradient>

    <!-- Outer Notebook Cover Gradient -->
    <linearGradient id="coverGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#111d3a" />
      <stop offset="100%" stop-color="#0b1428" />
    </linearGradient>

    <!-- Spine Gradient -->
    <linearGradient id="spineGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e2d4d" />
      <stop offset="100%" stop-color="#141f36" />
    </linearGradient>

    <!-- Glowing Cyan Border Gradient -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#2563eb" />
    </linearGradient>

    <!-- Soft Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#0284c7" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Base Dark App Icon Tile with Rounded Corners -->
  <rect x="16" y="16" width="480" height="480" rx="96" fill="url(#bgGrad)" />

  <!-- Main Catalog Notebook Group with Glow -->
  <g filter="url(#glow)">
    
    <!-- 4 Right Divider Tabs -->
    <rect x="390" y="125" width="42" height="48" rx="12" fill="#38bdf8" />
    <rect x="390" y="195" width="42" height="48" rx="12" fill="#2563eb" />
    <rect x="390" y="265" width="42" height="48" rx="12" fill="#0284c7" />
    <rect x="390" y="335" width="42" height="48" rx="12" fill="#1d4ed8" />

    <!-- Main Notebook Cover Body -->
    <rect x="80" y="80" width="320" height="352" rx="36" fill="url(#coverGrad)" stroke="url(#borderGrad)" stroke-width="10" />

    <!-- Technical Grid Lines on Cover -->
    <g stroke="#38bdf8" stroke-opacity="0.22" stroke-width="3">
      <line x1="140" y1="130" x2="380" y2="130" />
      <line x1="140" y1="175" x2="380" y2="175" />
      <line x1="140" y1="220" x2="380" y2="220" />
      <line x1="140" y1="265" x2="380" y2="265" />
      <line x1="140" y1="310" x2="380" y2="310" />
      <line x1="140" y1="355" x2="380" y2="355" />
      <line x1="140" y1="400" x2="380" y2="400" />

      <line x1="180" y1="90" x2="180" y2="422" />
      <line x1="225" y1="90" x2="225" y2="422" />
      <line x1="270" y1="90" x2="270" y2="422" />
      <line x1="315" y1="90" x2="315" y2="422" />
      <line x1="360" y1="90" x2="360" y2="422" />
    </g>

    <!-- Left Binder Spine Strip -->
    <rect x="80" y="80" width="56" height="352" rx="28" fill="url(#spineGrad)" stroke="url(#borderGrad)" stroke-width="10" />

    <!-- 3 Spine Rivet Holes -->
    <circle cx="108" cy="140" r="12" fill="#38bdf8" />
    <circle cx="108" cy="256" r="12" fill="#38bdf8" />
    <circle cx="108" cy="372" r="12" fill="#38bdf8" />

    <!-- Center Technical Emblem / Ficha Badge -->
    <rect x="208" y="196" width="100" height="110" rx="20" fill="#0b1428" stroke="#38bdf8" stroke-width="7" />

    <!-- Document Lines inside Emblem -->
    <line x1="230" y1="228" x2="286" y2="228" stroke="#38bdf8" stroke-width="5" stroke-linecap="round" />
    <line x1="230" y1="248" x2="286" y2="248" stroke="#38bdf8" stroke-width="5" stroke-linecap="round" />

    <!-- Checkmark Motif at bottom line of Emblem -->
    <path d="M 232 272 L 246 286 L 278 258" fill="none" stroke="#38bdf8" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" />

  </g>
</svg>