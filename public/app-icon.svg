<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b132b" />
      <stop offset="100%" stop-color="#1c2541" />
    </linearGradient>
    <linearGradient id="binderCover" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e3a8a" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="blueGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#2563eb" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.5" />
    </filter>
  </defs>

  <!-- Dark Navy Squircle Outer Container Badge -->
  <rect x="32" y="32" width="448" height="448" rx="108" fill="url(#bgGrad)" filter="url(#shadow)" />
  <rect x="32" y="32" width="448" height="448" rx="108" fill="none" stroke="#334155" stroke-width="4" opacity="0.6" />

  <!-- Technical Catalog Binder Book Symbol (Clean Vector, No Pipes) -->
  <g transform="translate(256, 256)">
    <!-- Binder Body -->
    <rect x="-140" y="-150" width="250" height="300" rx="16" fill="url(#binderCover)" stroke="url(#blueGlow)" stroke-width="8" />

    <!-- Spine Metal Bar -->
    <rect x="-140" y="-150" width="45" height="300" rx="8" fill="#1e293b" stroke="#38bdf8" stroke-width="4" />
    <circle cx="-117" cy="-100" r="8" fill="#38bdf8" />
    <circle cx="-117" cy="0" r="8" fill="#38bdf8" />
    <circle cx="-117" cy="100" r="8" fill="#38bdf8" />

    <!-- Index Tabs on Right Side -->
    <rect x="110" y="-120" width="30" height="45" rx="8" fill="#38bdf8" />
    <rect x="110" y="-60" width="30" height="45" rx="8" fill="#2563eb" />
    <rect x="110" y="0" width="30" height="45" rx="8" fill="#0284c7" />
    <rect x="110" y="60" width="30" height="45" rx="8" fill="#1e40af" />

    <!-- Technical Specification Blueprint Grid Lines on Cover -->
    <g stroke="#38bdf8" stroke-width="3" stroke-linecap="round" opacity="0.4">
      <line x1="-70" y1="-100" x2="80" y2="-100" />
      <line x1="-70" y1="-60" x2="80" y2="-60" />
      <line x1="-70" y1="-20" x2="80" y2="-20" />
      <line x1="-70" y1="20" x2="80" y2="20" />
      <line x1="-70" y1="60" x2="80" y2="60" />
      <line x1="-70" y1="100" x2="80" y2="100" />

      <line x1="-50" y1="-120" x2="-50" y2="110" />
      <line x1="-10" y1="-120" x2="-10" y2="110" />
      <line x1="30" y1="-120" x2="30" y2="110" />
      <line x1="70" y1="-120" x2="70" y2="110" />
    </g>

    <!-- Center Technical Catalog Icon (Document Spec Sheet + Checklist Motif) -->
    <g transform="translate(10, -5)" stroke="#ffffff" stroke-width="6" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <rect x="-40" y="-45" width="80" height="90" rx="8" fill="#0f172a" stroke="url(#blueGlow)" stroke-width="6" />
      <line x1="-20" y1="-25" x2="20" y2="-25" stroke="#38bdf8" stroke-width="5" />
      <line x1="-20" y1="-5" x2="20" y2="-5" stroke="#94a3b8" stroke-width="4" />
      <line x1="-20" y1="15" x2="10" y2="15" stroke="#94a3b8" stroke-width="4" />
      <polyline points="-20,30 -12,35 5,22" stroke="#38bdf8" stroke-width="5" />
    </g>
  </g>
</svg>
